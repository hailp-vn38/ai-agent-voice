services:
  server:
    # Keep optional built-in CAM++ unavailable without downloading real models.
    read_only: true
    image: voice-agent-server:qualification
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      target: qualification
    volumes:
      - type: bind
        source: ./docker/config.test.toml
        target: /app/config.toml
        read_only: true
      - test-data:/app/data
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '5', 'http://127.0.0.1:8000/ready']
      interval: 2s
      timeout: 6s
      retries: 30

  web:
    image: voice-agent-web:test
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
    depends_on:
      server:
        condition: service_healthy

  server-check:
    profiles: [checks]
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      target: test
    volumes:
      - type: bind
        source: /mnt/storage/ai-agent-voice/docker/test-target
        target: /mnt/storage/ai-agent-voice/target
        bind:
          create_host_path: false

  web-check:
    profiles: [checks]
    image: voice-agent-web:checks
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: test

  smoke:
    profiles: [checks]
    image: voice-agent-web:checks
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: test
    command: [node, /smoke.mjs]

volumes:
  test-data:
