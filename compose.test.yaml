services:
  server:
    # Keep optional built-in CAM++ unavailable without downloading real models.
    read_only: true
    image: vela-server:qualification
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      target: qualification
    volumes:
      - type: bind
        source: ./docker/config.test.toml
        target: /app/config.toml
        read_only: true
      - test-data:/app/data
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '5', 'http://127.0.0.1:8000/ready']
      interval: 2s
      timeout: 6s
      retries: 30

  web:
    image: vela-web:test
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
    depends_on:
      server:
        condition: service_healthy

  mosquitto:
    profiles: [push]
    image: ${VELA_MOSQUITTO_IMAGE:-iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18}
    command: [mosquitto, -c, /mosquitto/config/mosquitto.conf]
    volumes:
      - type: bind
        source: ./docker/mosquitto/mosquitto.test.conf
        target: /mosquitto/config/mosquitto.conf
        read_only: true
      - type: bind
        source: ./docker/mosquitto/auth.d
        target: /mosquitto/config/auth.d
        read_only: true
    depends_on:
      server:
        condition: service_healthy

  server-check:
    profiles: [checks]
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      target: test
    volumes:
      - type: bind
        source: ${VOICE_TEST_TARGET_DIR:-/mnt/storage/ai-agent-voice/docker/test-target}
        target: /mnt/storage/ai-agent-voice/target
        bind:
          create_host_path: false

  git-sync-smoke:
    profiles: [checks]
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      target: qualification
    user: "1000:1000"
    entrypoint: [/bin/sh, /tmp/wiki-git-smoke.sh]
    volumes:
      - type: bind
        source: ./scripts/docker/wiki-git-smoke.sh
        target: /tmp/wiki-git-smoke.sh
        read_only: true
        bind:
          create_host_path: false

  web-check:
    profiles: [checks]
    image: vela-web:checks
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: test

  smoke:
    profiles: [checks]
    image: vela-web:checks
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: test
    command: [node, /smoke.mjs]

volumes:
  test-data:
