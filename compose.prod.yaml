services:
  server:
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file: ./docker/secrets.env
    volumes:
      - type: bind
        source: ./docker/config.prod.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/credential-keys.json
        target: /app/docker/credential-keys.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/wiki-deploy-key
        target: /app/docker/wiki-deploy-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/github-known-hosts
        target: /app/docker/github-known-hosts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./runtime/kokoro-vi
        target: /app/runtime/kokoro-vi
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VOICE_PROD_DATA_DIR:-/mnt/storage/ai-agent-voice/docker/prod/data}
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ${VOICE_PROD_MODELS_DIR:-/mnt/storage/ai-agent-voice/docker/prod/models}
        target: /app/models
        bind:
          create_host_path: false

  web:
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"

  # Device Push Channel broker (ADR 0145); enable with COMPOSE_PROFILES=push or --profile push.
  # Certificate paths come from the deployment (.env); the key must be readable by root.
  mosquitto:
    ports:
      - "${MQTT_BIND:-0.0.0.0}:${MQTT_PORT:-8883}:8883"
    volumes:
      - type: bind
        source: ./docker/mosquitto/mosquitto.prod.conf
        target: /mosquitto/config/mosquitto.conf
        read_only: true
      - type: bind
        source: ${MQTT_TLS_CERT:-./docker/mosquitto/tls/fullchain.pem}
        target: /mosquitto/certs/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MQTT_TLS_KEY:-./docker/mosquitto/tls/privkey.pem}
        target: /mosquitto/certs/privkey.pem
        read_only: true
        bind:
          create_host_path: false
