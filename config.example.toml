[server]
bind = "127.0.0.1:8000"
public_ws_url = "ws://127.0.0.1:8000/voice/v1/"
hello_timeout_ms = 5000

[auth]
token = ""

# SQLite is required. The server creates its parent directory before opening the DB.
# V1 supports one Voice Agent process owning one local filesystem path;
# NFS/SMB, active-active, and multi-process writers are unsupported.
[database]
url = "sqlite://data/voice-agent.db"
max_connections = 5
busy_timeout_ms = 5000
migrate_on_start = true

# Every WS connection uses database-backed admission. Enrollment remains opt-in and
# must not be enabled with auto_register.
[database.devices]
auto_register = false

[database.devices.enrollment]
enabled = false
code_ttl_seconds = 600
retention_seconds = 86400
cleanup_interval_seconds = 60
max_pending = 1000
transport = "websocket" # "ota" preserves activation/polling without WS onboarding
ws_max_connections = 32
ws_timeout_seconds = 120
ws_poll_interval_ms = 2000
ws_prompt_repeat_seconds = 60
# Prepare the 11 WAV clips before enabling websocket enrollment:
# python3 scripts/prepare-enrollment-assets.py
prompt_assets_dir = "assets/enrollment/vi-VN"

# Persistent Transcript. Capture is off by default: with it off no archival writer, queue or task is
# started at all, while the retention of an already-captured archive, the Admin API read and the
# scoped purge all keep working. Retention is a property of the archive, not of capture, so turning
# capture off never turns existing data into unbounded retention.
[database.history]
enabled = false
retention_days = 30
# Records the archival writer may hold before it drops one. A dropped record costs the archive that
# row and nothing else: never a turn, a WebSocket close, or a change to Dialogue History.
queue_capacity = 256

# The Admin API mounts only when api.enabled is true and uses its own bearer token.
[api]
enabled = false
admin_token = ""

[shutdown]
grace_ms = 15000

[audio]
input_sample_rate = 16000
output_sample_rate = 24000
channels = 1
frame_ms = 60
max_utterance_ms = 30000

[websocket]
max_frame_bytes = 65536

[limits]
session_event_queue = 64
outbound_control_queue = 32
urgent_control_queue = 8
outbound_audio_queue = 32
llm_concurrency = 2
tts_concurrency = 2
vision_concurrency = 2

[provider_defaults]
# Server-wide fallback providers. A Template may override each slot independently;
# an absent Template binding uses the corresponding provider declared here.
vad = "silero_default"
asr = "gipformer_vi"
llm = "openai_primary"
tts = "chillaudio_default"
# Set a Vision instance ID when [vision].enabled is true.
# vision = "local_vision"

[vision]
enabled = false
# public_url = "http://127.0.0.1:8000/mcp/vision/explain"
max_image_bytes = 5242880
max_question_bytes = 4096
advertise_via_mcp = false

# [providers.vision.instances.local_vision]
# adapter = "openai_vision"
# base_url = "http://127.0.0.1:11434/v1/"
# api_key = ""
# model = "your-vision-model"
# timeout_ms = 30000
# max_tokens = 500
# temperature = 0.2
# top_p = 1.0

[providers.vad.instances.silero_default]
adapter = "silero_onnx"
min_speech_ms = 180
end_silence_ms = 600
pre_roll_ms = 300
speech_threshold = 0.50
exit_threshold = 0.35

[providers.asr.instances.zipformer_vi]
adapter = "zipformer_sherpa"
decoding_method = "greedy_search"

# Gipformer is an offline ASR candidate: PCM is buffered during capture and
# decoded once at utterance end. Keep Zipformer as the application default
# until a local qualification benchmark supports changing it.
[providers.asr.instances.gipformer_vi]
adapter = "gipformer_sherpa_offline"
decoding_method = "modified_beam_search"
max_active_paths = 4

[providers.llm.instances.openai_primary]
adapter = "openai"
api_key = ""
base_url = "https://api.openai.com/v1"
model = "model-name"

[providers.tts.instances.zerotts_maichi]
adapter = "zerotts_onnx"
voice = "maichi"
delivery_mode = "stream"

# Remote ChillAudio is a separate configured instance. Agent binding selects it
# without changing another provider block; it does not use Model Preparation.
[providers.tts.instances.chillaudio_default]
adapter = "chillaudio_ws"
token = "set-deployment-token-here"
# voice = "BV421_vivn_streaming"

# Local Vietnamese Kokoro. Model Preparation acquires and converts all pinned
# voicepacks. Install the deployment-owned G2P sidecar before selecting it.
# [providers.tts.instances.kokoro_vi]
# adapter = "kokoro_vi_onnx"
# voice = "diem_trinh"
# language = "vi-VN"
# speed_percent = 100
# preload = false

# [runtime.kokoro_vi]
# g2p_executable = "runtime/kokoro-vi/kokoro_vi_g2p"

[tts]
# Voice: maximum wait for first/next non-empty PCM; diagnostics: total synthesis budget.
timeout_ms = 15000

[speech_output]
min_chars = 24
soft_break_min_chars = 48
max_chars = 160
pending_segments = 8

[workers.vad]
max_workers = 4
command_queue_capacity = 32
reset_timeout_ms = 15000
cleanup_grace_ms = 5000

[workers.asr]
max_workers = 2
command_queue_capacity = 32
final_timeout_ms = 15000
cleanup_grace_ms = 5000

[workers.tts]
max_workers = 2
command_queue_capacity = 32
cleanup_grace_ms = 5000

# CAM++ is one built-in runtime; not a Provider/Template binding.
# Similarity is advisory for personalized conversation, never authentication.
[speaker_recognition]
similarity_threshold = 0.5
max_speakers = 256
max_candidates_per_agent = 32

[speaker_recognition.enrollment]
min_clip_ms = 2000
max_clip_ms = 10000
min_speech_ms = 1800
max_window_ms = 6000
max_open_enrollments = 16
max_audio_body_bytes = 524288

[deployment]
# Explicit pilot: one active voice pipeline process-wide; idle sockets remain connected.
speaker_pilot = false
profile = "development-noncommercial"

# Model files are owned by each provider: it downloads what it is missing into `models/` when the
# runtime manager materializes it, and reuses whatever is already there. Nothing here configures
# where models live or where they come from.
[runtime.onnx]
library = "runtime/onnxruntime/libonnxruntime.dylib"

# Server-owned execution settings. Admin provider JSON cannot override these.
[runtime.onnx.threads]
campplus_sherpa = 1
silero_onnx = 1
zipformer_sherpa = 2
gipformer_sherpa_offline = 4
zerotts_onnx = 2
kokoro_vi_onnx = 2

[runtime.chillaudio]
# ws_url = "wss://your-deployment-chillaudio-endpoint.example/ws"
timeout_ms = 12000





[llm]
max_history_messages = 20
prompt_budget_tokens = 12000
max_tool_result_chars = 4096

# Tool-round Executor caps, applied to Device MCP, External MCP and the builtin
# actions alike. A cap is checked before the work it bounds, and exceeding one
# terminalizes the turn: it never produces a synthetic tool result. Every bound is
# a hard ceiling, so `0` and an out-of-range value both fail startup.
#   max_calls_per_round  1..=32
#   max_rounds_per_turn  1..=8   (tool rounds a turn may continue past its first)
#   execution_budget_ms  1..=120000 (one turn's total tool work, from its first call)
[llm.tools]
max_calls_per_round = 8
max_rounds_per_turn = 4
execution_budget_ms = 30000

# Optional: omit [agent] to use the built-in Mây / vi-VN persona and template.
[agent]
name = "Mây"
language = "vi-VN"
persona = """
Bạn là Mây, một trợ lý giọng nói tiếng Việt.
Bạn trả lời tự nhiên, thân thiện và súc tích.
Ưu tiên nội dung dễ nghe qua loa.
"""
# prompt_template = "prompts/custom-voice-assistant.txt"

# Optional bounded hot-runtime manager. Enable only after measuring every adapter/model/worker
# envelope on the deployment host. A measured envelope stays valid for as long as the provider's
# pinned model revision and execution settings are unchanged; bumping either requires measuring
# again. See docs/provider-runtime-manager-qualification.md for the development host example and the
# qualification boundary.
# [provider_runtime]
# max_parallel_loads = 1
# max_pending_loads = 8
# max_waiters = 64
# max_resident_bytes = 8589934592
# max_resources = 16
# max_version_entries = 128
# admission_timeout_ms = 5000
# startup_timeout_ms = 60000
# failure_cooldown_ms = 1000
# idle_ttl_ms = 600000
#
# [provider_runtime.estimated_peak_bytes]
# CAM++: 256 MiB covers this Linux host measurement (115992 KiB peak, threads=1, synthetic 1-6s).
# Remeasure on the deployment host before enabling the runtime manager.
# campplus_sherpa = 268435456
# silero_onnx = 134217728
# gipformer_sherpa_offline = 536870912
# kokoro_vi_onnx = 3221225472
# zerotts_onnx = 4294967296
# openai = 67108864
# chillaudio_ws = 67108864

[mcp]
enabled = true
call_timeout_ms = 30000
discovery_timeout_ms = 10000
# Every valid unique tool announced by an admitted Device is exposed to that Device session.
# Tool results normally return to the LLM before final TTS.
result_delivery = "llm_then_tts"
# Per-tool overrides use the original MCP wire name. `direct_tts` only speaks
# successful plain-text results; structured JSON remains silent.
# [[mcp.tool_policy]]
# name = "self.audio_speaker.set_volume"
# result_delivery = "direct_tts"

# External MCP is separate from Device MCP: these are server-side Streamable HTTP
# servers bound to an Agent, snapshotted once at each Voice Session admission.
[mcp.external]
per_server_resolution_timeout_ms = 3000
overall_resolution_budget_ms = 5000
# Process-global outbound concurrency per MCP server, shared by every session.
max_concurrent_calls_per_server = 16

# Caps are applied at the untrusted catalog boundary and reject rather than truncate.
[mcp.external.limits]
max_tools_per_server = 128
max_tools_per_session = 512
max_tool_schema_bytes = 16384
max_tool_description_bytes = 4096
max_external_tool_result_bytes = 16384
max_pages_per_server = 32

# HTTP and HTTPS work by default. Optionally restrict destinations by hostname.
# An empty allowed_hosts list accepts any host; redirects are never followed.
[mcp.external.network]
allowed_hosts = []
