[server]
bind = "0.0.0.0:8000"
public_ws_url = "ws://web:8080/voice/v1/"

[auth]
token = "docker-test-voice"

[api]
enabled = true
admin_token = "docker-test-admin"

[database]
url = "sqlite://data/voice-agent.db"

[provider_defaults]
vad = "test_vad"
asr = "test_asr"
llm = "test_llm"
tts = "test_tts"

[providers.vad.instances.test_vad]
adapter = "qualification_vad"

[providers.asr.instances.test_asr]
adapter = "qualification_asr"

[providers.llm.instances.test_llm]
adapter = "qualification_llm"

[providers.tts.instances.test_tts]
adapter = "qualification_tts"

# Shared plugin runtime; sockets and directories must be mounted by compose.yaml.
# Background enablement and LLM choices remain Admin settings.
[background]
plugin_installer_socket = "/run/plugin-installer/installer.sock"
plugin_runner_socket = "/run/plugin-runner/runner.sock"
plugin_installations_dir = "data/plugins/installations"
plugin_staging_dir = "data/plugins/staging"
plugin_attempts_dir = "data/plugins/workspaces"
plugin_curated_dir = "data/curated-plugins"
