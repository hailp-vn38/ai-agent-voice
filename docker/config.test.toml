[server]
bind = "0.0.0.0:8000"
public_ws_url = "ws://web:8080/voice/v1/"

[auth]
token = "docker-test-voice"

[api]
enabled = true
jwt_secret = "docker-test-jwt-signing-secret-0123456789"

[database]
url = "sqlite://data/vela.db"

# The test server runs with a read-only root; built-in job skills are installed at startup, so the
# skills directory must live under the mounted data/ volume like every other orchestrator path.
[orchestrator]
skills_dir = "data/skills"

[provider_defaults]
vad = "test_vad"
asr = "test_asr"
llm = "test_llm"
tts = "test_tts"

[providers.vad.instances.test_vad]
adapter = "qualification_vad"

[providers.asr.instances.test_asr]
adapter = "qualification_asr"

[providers.llm.instances.test_llm]
adapter = "qualification_llm"

[providers.tts.instances.test_tts]
adapter = "qualification_tts"

