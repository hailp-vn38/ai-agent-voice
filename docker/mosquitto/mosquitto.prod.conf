# Production: TLS listener on the public port; certificate paths come from the deployment
# (MQTT_TLS_CERT / MQTT_TLS_KEY in .env, mounted by compose.prod.yaml). A second plain listener
# serves the Vela server over the compose network only; it is never published.
per_listener_settings false
persistence true
persistence_location /mosquitto/data/

listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

listener 1883

include_dir /mosquitto/config/auth.d
