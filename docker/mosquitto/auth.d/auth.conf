# Shared by every environment. Mosquitto keeps no user list: each decision is an HTTP call to the
# Vela server (crates/vela-server/src/app/mqtt_auth.rs). Status-only answers: 200 allows, else denies.
allow_anonymous false

auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_http_host server
auth_opt_http_port 8000
auth_opt_http_method POST
auth_opt_http_params_mode json
auth_opt_http_response_mode status
auth_opt_http_getuser_uri /mqtt/auth/user
auth_opt_http_superuser_uri /mqtt/auth/superuser
auth_opt_http_aclcheck_uri /mqtt/auth/acl
# Do not cache: a blocked Device must lose access on its next check.
auth_opt_cache false
auth_opt_log_level warn
