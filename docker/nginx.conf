map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Keep the scheme set by an outer TLS proxy (e.g. tailscale serve) for same-origin checks.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

# Studio has its own /mcp and /mcp/:key pages: browser page loads under /mcp/ get the SPA,
# every other request (MCP POST, SSE GET, session DELETE) goes to the server.
map "$request_method:$http_accept" $mcp_page_load {
    default 0;
    "~^GET:.*text/html" 1;
}

# Tickets travel in the WS query: access logs record only the path.
log_format path_only '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log path_only;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;

    location = /voice/v1/ {
        # Nginx error messages include the full request URL, including one-use tickets.
        error_log /dev/null;
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Without this, nginx answers /mcp with a 301 to the proxied /mcp/ prefix.
    location = /mcp {
        try_files /index.html =404;
    }

    location ^~ /mcp/ {
        if ($mcp_page_load) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location ~ ^/(api|voice)(/|$)|^/(health|ready)$ {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
