services:
  server:
    image: ${VELA_SERVER_IMAGE:-vela-server:${IMAGE_TAG:-local}}
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      target: production
    environment:
      VELA_CONFIG: /app/config.toml
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '5', 'http://127.0.0.1:8000/ready']
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 30m

  web:
    image: ${VELA_WEB_IMAGE:-vela-web:${IMAGE_TAG:-local}}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
    depends_on:
      server:
        condition: service_healthy


  # Device Push Channel broker (ADR 0145). Off unless the `push` profile is enabled.
  mosquitto:
    profiles: [push]
    image: ${VELA_MOSQUITTO_IMAGE:-iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18}
    command: [mosquitto, -c, /mosquitto/config/mosquitto.conf]
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./docker/mosquitto/auth.d
        target: /mosquitto/config/auth.d
        read_only: true
      - mosquitto-data:/mosquitto/data

volumes:
  mosquitto-data:
