services:
  server:
    depends_on:
      vieneu:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./docker/credential-keys.json
        target: /app/docker/credential-keys.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./runtime/kokoro-vi
        target: /app/runtime/kokoro-vi
        read_only: true
        bind:
          create_host_path: false
  web:
    ports: !override
      - "0.0.0.0:8080:8080"
  vieneu:
    volumes:
      - type: bind
        source: /mnt/storage/ai-agent-voice/runtime/vieneu-live/huggingface
        target: /home/app/.cache/huggingface
        bind:
          create_host_path: false
