name: temporary-v2-rustfmt
on:
  push:
    branches: [feature/agent-job-v2-hierarchical-server]
permissions:
  contents: write
jobs:
  format-changed-rust:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agent-job-v2-hierarchical-server
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Format only V2-touched Rust sources
        shell: bash
        run: |
          set -euo pipefail
          files=(
            crates/voice-agent-server/src/config/background.rs
            crates/voice-agent-server/src/services/background/mod.rs
            crates/voice-agent-server/src/services/background/model.rs
            crates/voice-agent-server/src/services/background/agent_loop.rs
            crates/voice-agent-server/src/services/background/orchestration.rs
            crates/voice-agent-server/src/services/background/engine.rs
            crates/voice-agent-server/src/services/background/tests/mod.rs
            crates/voice-agent-server/src/services/background/tests/hierarchical.rs
            crates/voice-agent-server/src/database/jobs/mod.rs
            crates/voice-agent-server/src/database/jobs/hierarchical.rs
            crates/voice-agent-server/src/database/jobs/submission.rs
            crates/voice-agent-server/src/database/jobs/orchestration.rs
            crates/voice-agent-server/src/database/jobs/execution.rs
            crates/voice-agent-server/src/database/jobs/events.rs
            crates/voice-agent-server/src/database/jobs/recovery.rs
            crates/voice-agent-server/src/database/jobs/steps.rs
          )
          rustfmt --edition 2024 --config skip_children=true "${files[@]}"
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(background): format hierarchical server Rust sources'
            git push origin HEAD:feature/agent-job-v2-hierarchical-server
          fi
