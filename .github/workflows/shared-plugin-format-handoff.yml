name: shared-plugin-format-handoff
on:
  push:
    branches: [feature/shared-plugin-runtime]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Formatted Rust source handoff
        if: ${{ always() && !cancelled() }}
        run: |
          rustfmt --edition 2024 --config skip_children=true crates/vela-server/src/bin/plugin-runtime.rs crates/vela-server/src/config/background.rs crates/vela-server/src/services/background/plugins/archive.rs crates/vela-server/src/services/background/plugins/builder.rs crates/vela-server/src/services/background/plugins/contracts.rs crates/vela-server/src/services/background/plugins/dispatch.rs crates/vela-server/src/services/background/plugins/mod.rs crates/vela-server/src/services/background/plugins/qualification.rs crates/vela-server/src/services/background/plugins/reaper.rs crates/vela-server/src/services/background/plugins/runner.rs crates/vela-server/src/services/background/plugins/tests.rs crates/vela-server/src/services/background/tests/execution.rs crates/vela-server/src/database/jobs/execution.rs crates/vela-server/src/database/jobs/orchestration.rs
          for file in crates/vela-server/src/bin/plugin-runtime.rs crates/vela-server/src/config/background.rs crates/vela-server/src/services/background/plugins/archive.rs crates/vela-server/src/services/background/plugins/builder.rs crates/vela-server/src/services/background/plugins/contracts.rs crates/vela-server/src/services/background/plugins/dispatch.rs crates/vela-server/src/services/background/plugins/mod.rs crates/vela-server/src/services/background/plugins/qualification.rs crates/vela-server/src/services/background/plugins/reaper.rs crates/vela-server/src/services/background/plugins/runner.rs crates/vela-server/src/services/background/plugins/tests.rs crates/vela-server/src/services/background/tests/execution.rs crates/vela-server/src/database/jobs/execution.rs crates/vela-server/src/database/jobs/orchestration.rs; do
            echo "__RUSTFMT_BEGIN__${file}"
            base64 -w0 "${file}"
            echo
            echo "__RUSTFMT_END__${file}"
          done
