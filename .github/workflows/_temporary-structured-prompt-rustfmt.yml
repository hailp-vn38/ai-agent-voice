name: Temporary Structured Prompt Rustfmt
on:
  push:
    branches:
      - feat/structured-system-prompt-blocks
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Format Rust source
        run: cargo fmt --all
      - name: Commit formatted Rust
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/voice-agent-server/src/config/mod.rs crates/voice-agent-server/src/session/prompt.rs crates/voice-agent-server/src/session/actor/delivery.rs
          git commit -m "style(prompt): rustfmt structured system prompt"
          git push origin HEAD:feat/structured-system-prompt-blocks
