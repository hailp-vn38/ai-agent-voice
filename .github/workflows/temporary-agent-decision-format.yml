name: temporary-agent-decision-format
on:
  push:
    branches: [fix/agent-job-v2-decision-diagnostics]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-job-v2-decision-diagnostics
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Format V2 decision files
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --config skip_children=true             crates/voice-agent-server/src/services/background/agent_loop.rs             crates/voice-agent-server/src/services/background/tests/hierarchical.rs             crates/voice-agent-server/src/database/jobs/events.rs
          git add --             crates/voice-agent-server/src/services/background/agent_loop.rs             crates/voice-agent-server/src/services/background/tests/hierarchical.rs             crates/voice-agent-server/src/database/jobs/events.rs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(background): format decision validation code'
            git push origin HEAD:fix/agent-job-v2-decision-diagnostics
          fi
