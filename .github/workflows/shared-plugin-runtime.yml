name: shared-plugin-runtime
on:
  push:
    branches:
      - feature/shared-plugin-runtime
  pull_request:
    paths:
      - 'docker/plugin-runtime.Dockerfile'
      - 'crates/voice-agent-server/src/bin/plugin-runtime.rs'
      - 'crates/voice-agent-server/src/services/background/**'
      - 'crates/voice-agent-server/src/database/jobs/**'
      - 'crates/voice-agent-server/migrations/0110_shared_plugin_installations.sql'
      - 'plugins/**'
      - '.github/workflows/shared-plugin-runtime.yml'
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Formatted Rust source handoff
        if: ${{ always() && !cancelled() }}
        run: |
          rustfmt --edition 2024 --config skip_children=true crates/voice-agent-server/src/bin/plugin-runtime.rs crates/voice-agent-server/src/config/background.rs crates/voice-agent-server/src/services/background/plugins/archive.rs crates/voice-agent-server/src/services/background/plugins/builder.rs crates/voice-agent-server/src/services/background/plugins/contracts.rs crates/voice-agent-server/src/services/background/plugins/dispatch.rs crates/voice-agent-server/src/services/background/plugins/mod.rs crates/voice-agent-server/src/services/background/plugins/qualification.rs crates/voice-agent-server/src/services/background/plugins/reaper.rs crates/voice-agent-server/src/services/background/plugins/runner.rs crates/voice-agent-server/src/services/background/plugins/tests.rs crates/voice-agent-server/src/services/background/tests/execution.rs crates/voice-agent-server/src/database/jobs/execution.rs crates/voice-agent-server/src/database/jobs/orchestration.rs
          for file in crates/voice-agent-server/src/bin/plugin-runtime.rs crates/voice-agent-server/src/config/background.rs crates/voice-agent-server/src/services/background/plugins/archive.rs crates/voice-agent-server/src/services/background/plugins/builder.rs crates/voice-agent-server/src/services/background/plugins/contracts.rs crates/voice-agent-server/src/services/background/plugins/dispatch.rs crates/voice-agent-server/src/services/background/plugins/mod.rs crates/voice-agent-server/src/services/background/plugins/qualification.rs crates/voice-agent-server/src/services/background/plugins/reaper.rs crates/voice-agent-server/src/services/background/plugins/runner.rs crates/voice-agent-server/src/services/background/plugins/tests.rs crates/voice-agent-server/src/services/background/tests/execution.rs crates/voice-agent-server/src/database/jobs/execution.rs crates/voice-agent-server/src/database/jobs/orchestration.rs; do
            echo "__RUSTFMT_BEGIN__${file}"
            base64 -w0 "${file}"
            echo
            echo "__RUSTFMT_END__${file}"
          done
      - name: Agent Job rustfmt handoff (temporary)
        if: ${{ always() && !cancelled() }}
        run: |
          for file in \
            crates/voice-agent-server/src/app/admin/provider_test_drafts.rs \
            crates/voice-agent-server/src/app/admin/provider_tests.rs \
            crates/voice-agent-server/src/database/jobs/providers.rs \
            crates/voice-agent-server/src/database/jobs/submission.rs \
            crates/voice-agent-server/src/database/providers/config.rs \
            crates/voice-agent-server/src/providers/factory_registry.rs \
            crates/voice-agent-server/src/providers/llm/mod.rs \
            crates/voice-agent-server/src/providers/llm/openai/chat.rs \
            crates/voice-agent-server/src/providers/llm/openai/chat_tests.rs \
            crates/voice-agent-server/src/providers/llm/openai/config.rs \
            crates/voice-agent-server/src/providers/llm/openai/descriptor.rs \
            crates/voice-agent-server/src/providers/llm/openai/mod.rs \
            crates/voice-agent-server/src/providers/llm/openai/responses.rs \
            crates/voice-agent-server/src/providers/llm/openai/responses_background_tests.rs \
            crates/voice-agent-server/src/providers/llm/opencode_free.rs \
            crates/voice-agent-server/src/providers/llm/opencode_free/tests.rs \
            crates/voice-agent-server/src/providers/runtime_catalog.rs \
            crates/voice-agent-server/src/services/background/agent_loop.rs \
            crates/voice-agent-server/src/services/background/models.rs \
            crates/voice-agent-server/src/services/background/plugins/contracts.rs \
            crates/voice-agent-server/src/services/background/plugins/contracts_tests.rs \
            crates/voice-agent-server/src/services/background/plugins/mod.rs \
            crates/voice-agent-server/src/services/background/tests/hierarchical.rs \
            crates/voice-agent-server/src/services/background/tests/mod.rs \
            crates/voice-agent-server/src/services/provider/diagnostic.rs \
            crates/voice-agent-server/src/services/provider/test.rs \
            crates/voice-agent-server/src/workers/llm/mod.rs; do
            rustfmt --edition 2024 --config skip_children=true "$file"
            echo "__AGENT_RUSTFMT_BEGIN__${file}"
            base64 -w0 "$file"
            echo
            echo "__AGENT_RUSTFMT_END__${file}"
          done
      - name: Shared runtime binary
        run: cargo check --locked -p voice-agent-server --bin plugin-runtime
      - name: Plugin contract tests
        if: ${{ always() && !cancelled() }}
        run: cargo test --locked -p voice-agent-server --lib services::background::plugins
      - name: Workspace formatting
        if: ${{ always() && !cancelled() }}
        run: cargo fmt --all --check
      - name: Python ZIP packaging contracts
        if: ${{ always() && !cancelled() }}
        run: python3 -m unittest discover -s scripts/tests -p test_rust_plugins.py
