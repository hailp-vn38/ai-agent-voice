name: temporary-decision-web-verify
on:
  push:
    branches: [fix/agent-job-v2-decision-diagnostics]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci --prefix apps/admin-web
      - run: npm test --prefix apps/admin-web -- --run src/domain/jobs/llm-activity.test.ts src/domain/jobs/unified-activity.test.ts
      - run: npm run typecheck --prefix apps/admin-web
