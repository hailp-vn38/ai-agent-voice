name: devices-ui

on:
  push:
    paths:
      - 'apps/admin-web/**'
      - '.github/workflows/devices-ui.yml'
  pull_request:
    paths:
      - 'apps/admin-web/**'
      - '.github/workflows/devices-ui.yml'

jobs:
  verify-devices:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci --progress=false
      - run: npm run typecheck
      - name: Focused Device and Agent tests
        run: npx vitest run src/components/devices/presentation.test.ts src/components/devices/DeviceCard.test.ts src/pages/devices/DeviceDetailPage.test.ts src/components/agents/AgentDeviceCard.test.ts src/components/agents/AgentDeviceList.test.ts
      - run: npm run build
