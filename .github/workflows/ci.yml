name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Device enrollment tests
        if: ${{ always() && !cancelled() }}
        run: |
          cargo test -p voice-agent-server --test device_enrollment_ws
          cargo test -p voice-agent-server --lib services::device_enrollment
      - name: Device admission and protocol regression tests
        if: ${{ always() && !cancelled() }}
        run: cargo test -p voice-agent-server --test device_admission --test database_bootstrap --test ws_protocol
      - run: cargo test --workspace
        if: ${{ always() && !cancelled() }}
  speaker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Built-in Speaker identification
        run: cargo test -p voice-agent-server --test speaker_identification_builtin
