name: agent-ui

on:
  push:
    paths:
      - 'apps/admin-web/src/components/agents/**'
      - 'apps/admin-web/src/components/icons/**'
      - 'apps/admin-web/src/i18n/messages.ts'
      - '.github/workflows/agent-ui.yml'
  pull_request:
    paths:
      - 'apps/admin-web/src/components/agents/**'
      - 'apps/admin-web/src/components/icons/**'
      - 'apps/admin-web/src/i18n/messages.ts'
      - '.github/workflows/agent-ui.yml'

jobs:
  verify-agent-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci --progress=false
      - run: npm run typecheck
      - name: Verify Agent header and Device card interactions
        run: npx vitest run src/components/agents/AgentHeader.test.ts src/components/agents/AgentDeviceCard.test.ts src/components/agents/AgentDeviceList.test.ts
      - run: npm run build
