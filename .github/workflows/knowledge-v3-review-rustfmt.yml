name: Knowledge V3 Review Rustfmt (temporary)
# Final run after whole-vault guard and regression test additions.
on:
  push:
    branches: [feat/knowledge-memory-v3-file-first-index]
    paths: ['.github/workflows/knowledge-v3-review-rustfmt.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/knowledge-memory-v3-file-first-index
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Format all Rust source and commit tracked changes
        run: |
          cargo fmt --all
          git diff --name-only
          if git diff --name-only | grep -v '\.rs$'; then
            echo 'Unexpected non-Rust changes' >&2
            exit 1
          fi
          git add -u
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(knowledge): rustfmt code-review remediation'
            git push origin HEAD:feat/knowledge-memory-v3-file-first-index
          fi
