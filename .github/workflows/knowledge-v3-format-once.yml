name: Knowledge V3 One-time Rust Format
on:
  push:
    branches:
      - feat/knowledge-memory-v3-file-first-index
    paths:
      - '.github/workflows/knowledge-v3-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/knowledge-memory-v3-file-first-index
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Format only changed Rust modules
        run: |
          cargo fmt --all
          git add crates/voice-agent-server/src/services/knowledge \
            crates/voice-agent-server/src/database/knowledge_index.rs \
            crates/voice-agent-server/src/app/admin/knowledge.rs \
            crates/voice-agent-server/src/app/admin/mod.rs \
            crates/voice-agent-server/src/app/state.rs \
            crates/voice-agent-server/src/database/mod.rs \
            crates/voice-agent-server/src/services/mod.rs
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(knowledge): apply rustfmt to Rust implementation'
            git push origin HEAD:feat/knowledge-memory-v3-file-first-index
          fi
