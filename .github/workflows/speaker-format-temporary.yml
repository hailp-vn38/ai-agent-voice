name: Temporary Speaker Rustfmt
on:
  push:
    branches:
      - feat/speaker-profile-asr-join
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Apply Rust formatting
        run: cargo fmt --all
      - name: Commit formatted Rust
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style(speaker): format Rust implementation"
          git push origin HEAD:feat/speaker-profile-asr-join
