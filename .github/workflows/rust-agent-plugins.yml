name: Rust Agent Job Plugins
on:
  workflow_dispatch:
  push:
    branches:
      - feat/rust-web-document-plugins
    paths:
      - 'plugins/web-extractor/**'
      - 'plugins/document-analysis/**'
      - 'plugins/rust-plugin-sdk/**'
      - '.github/workflows/rust-agent-plugins.yml'
jobs:
  server-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Server formatting
        run: scripts/agent-test.sh run -- cargo fmt --check
      - name: Server compile
        if: always() && !cancelled()
        run: scripts/agent-test.sh check voice-agent-server
  package:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        plugin: [web-extractor, document-analysis]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: scripts/agent-test.sh run -- cargo test --manifest-path plugins/${{ matrix.plugin }}/Cargo.toml
      - name: Build
        run: scripts/agent-test.sh run -- cargo build --release --manifest-path plugins/${{ matrix.plugin }}/Cargo.toml
      - name: Prepare Store ZIP
        shell: bash
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          mkdir -p "/tmp/package/bin" "/tmp/package/schemas"
          cp "plugins/$PLUGIN/target/release/$PLUGIN" "/tmp/package/bin/plugin"
          chmod 0555 "/tmp/package/bin/plugin"
          cp "plugins/$PLUGIN/plugin.toml" "/tmp/package/plugin.toml"
          cp "plugins/$PLUGIN/instructions.md" "/tmp/package/instructions.md"
          cp plugins/"$PLUGIN"/schemas/*.json /tmp/package/schemas/
          file /tmp/package/bin/plugin
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path("/tmp/package")
          manifest = (root / "plugin.toml").read_text()
          assert 'kind = "rust_container"' in manifest
          assert 'entrypoint = "bin/plugin"' in manifest
          for path in (root / "schemas").glob("*.json"):
              json.loads(path.read_text())
          content = (root / "bin/plugin").read_bytes()
          assert content[:4] == b"\x7fELF"
          assert len(content) < 19 * 1024 * 1024
          PY
          (cd /tmp/package && zip -qr "/tmp/$PLUGIN-1.0.0.zip" plugin.toml instructions.md schemas bin)
          python3 - <<'PY'
          import os, zipfile
          name = os.environ["PLUGIN"]
          path = f"/tmp/{name}-1.0.0.zip"
          with zipfile.ZipFile(path) as z:
              assert len(z.namelist()) < 128
              assert sum(i.file_size for i in z.infolist()) < 32 * 1024 * 1024
              assert "bin/plugin" in z.namelist()
          assert os.path.getsize(path) < 20 * 1024 * 1024
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-1.0.0
          path: /tmp/${{ matrix.plugin }}-1.0.0.zip
          if-no-files-found: error
