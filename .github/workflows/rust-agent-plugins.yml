name: Rust Agent Job Plugins
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plugins/**'
      - 'scripts/*rust*plugin*'
      - 'crates/voice-agent-server/src/services/background/plugins/**'
      - 'crates/voice-agent-server/examples/check-plugin.rs'
      - '.github/workflows/rust-agent-plugins.yml'
  push:
    branches:
      - feat/rust-web-document-plugins
    paths:
      - 'plugins/web-extractor/**'
      - 'plugins/document-analysis/**'
      - 'plugins/rust-plugin-sdk/**'
      - 'plugins/fixture-rust-1.0.0/**'
      - 'scripts/*rust*plugin*'
      - 'crates/voice-agent-server/src/services/background/plugins/**'
      - 'crates/voice-agent-server/examples/check-plugin.rs'
      - '.github/workflows/rust-agent-plugins.yml'
jobs:
  server-compat:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/rust-plugin-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Plugin tooling formatting
        run: scripts/agent-test.sh run -- rustfmt --check --edition 2024 --config skip_children=true crates/voice-agent-server/src/services/background/plugins/{builder,dispatch,qualification}.rs crates/voice-agent-server/src/services/background/plugins/qualification/tests.rs crates/voice-agent-server/examples/check-plugin.rs
      - name: Plugin contract tests
        run: scripts/agent-test.sh run -- cargo test --locked --quiet -p voice-agent-server --lib services::background::plugins
      - name: SDK tests
        run: scripts/agent-test.sh run -- cargo test --locked --quiet --manifest-path plugins/rust-plugin-sdk/Cargo.toml
      - name: Packaging tests
        run: scripts/agent-test.sh run -- python3 -m unittest discover -s scripts/tests -p test_rust_plugins.py
      - name: Server compile
        if: always() && !cancelled()
        run: scripts/agent-test.sh check voice-agent-server
  package:
    runs-on: ubuntu-22.04
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/rust-plugin-target
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: web-extractor
            artifact: web-extractor
          - plugin: document-analysis
            artifact: document-analysis
          - plugin: fixture-rust-1.0.0
            artifact: fixture-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test, build and validate Store ZIP
        run: scripts/agent-test.sh run -- python3 scripts/package-rust-plugins.py --output /tmp/rust-plugins ${{ matrix.plugin }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-1.0.0
          path: /tmp/rust-plugins/${{ matrix.artifact }}-1.0.0.zip
          if-no-files-found: error
