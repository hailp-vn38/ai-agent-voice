const stateBadge=f=>f.status==='confirmed'?`<span class="chip good">${I('check','sm')} Đã xác nhận</span>`:`<span class="chip warn">${I('clock','sm')} Chờ xác nhận</span>`;
function deviceSel(){return `<select class="select-inline" data-control="device" aria-label="Chọn Device">${devices.map(d=>`<option value="${d.id}" ${d.id===state.device?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`}
function modeBadge(){let m=df().mode;return `<span class="chip ${m==='read_write'?'good':m==='off'?'warn':''}">${I(m==='off'?'alert':'shield','sm')} ${m==='read_write'?'Read & write':m==='read_only'?'Read only':'Off'}</span>`}
function filterSearch(placeholder='Tìm theo tên, hook, nội dung...'){return `<form data-form="search" class="search-wrap grow" role="search">${I('search','sm')}<input id="filterQuery" type="search" value="${esc(state.query)}" placeholder="${esc(placeholder)}" aria-label="Tìm kiếm memory"><button type="submit" aria-label="Tìm">${I('chevron','sm')}</button></form>`}
function globalCtas(){return `${deviceSel()}<button class="btn" data-action="profile">${I('user','sm')} Profile</button><button class="btn" data-action="rebuild">${I('refresh','sm')} Rebuild</button><button class="btn primary" data-action="new">${I('plus','sm')} New fact</button>`}
function notice(){return `<div class="notice">${I('info','sm')}<span>Memory được phân vùng theo Device, <b>không phải ranh giới bảo mật</b>. Người trong mạng LAN biết Device ID có thể truy cập và Fact có thể được gửi đến LLM provider. Đây là dữ liệu mẫu để thử giao diện.</span></div>`}
function factMeta(f){return `<div class="fact-meta"><span>r${f.revision}</span><span>·</span><span>${esc(f.updated)}</span><span>·</span><span>${esc(f.origin)}</span>${f.pinned?`<span style="color:var(--amber)">${I('pin','sm')} Đã ghim</span>`:''}</div>`}
function filtersA(){let all=[['all','Tất cả bộ nhớ','layers'],['pinned','Đã ghim','pin'],['pending','Chờ xác nhận','clock'],...Object.keys(kinds).map(k=>[k,kinds[k].label,kinds[k].icon])];return all.map(([k,l,i])=>`<button class="a-nav-item ${state.kind===k?'active':''}" data-action="kind" data-value="${k}">${I(i,'sm')} <span class="grow">${l}</span><span class="num">${k==='all'?own().length:k==='pinned'?own().filter(f=>f.pinned).length:k==='pending'?own().filter(f=>f.status!=='confirmed').length:own().filter(f=>f.kind===k).length}</span></button>`).join('')}
function inspectorA(){let f=selected();if(!f)return `<div class="a-panel a-inspector"><div class="a-empty-editor"><div class="orb">${I('brain','xl')}</div><h3 style="margin:2px 0 5px">Khám phá một ký ức</h3><p class="muted small" style="line-height:1.6">Chọn Fact ở danh sách để xem chi tiết, chỉnh sửa và kiểm soát dữ liệu AI nhận.</p><button data-action="new" class="btn primary" style="margin-top:11px">${I('plus','sm')} Tạo fact mới</button></div></div>`;return `<aside class="a-panel a-inspector"><div class="between" style="margin-bottom:12px"><span class="micro muted">Fact inspector</span><span class="chip">#${f.id}</span></div><div class="cover"><div class="row">${I(kinds[f.kind].icon,'xl')} <span class="micro">${esc(kinds[f.kind].label)}</span></div>${f.pinned?I('pin','lg'):I('sparkle','lg')}</div><div class="between">${kindTag(f)}${stateBadge(f)}</div><h2>${esc(f.title)}</h2><div class="muted small" style="line-height:1.5">${esc(f.hook)}</div><div class="a-detail-body">${esc(f.body)}</div><div class="a-data-row"><span>Trong ngữ cảnh AI</span><b>${isInSummary(f)?'Có · preview':'Không'}</b></div><div class="a-data-row"><span>Revision / nguồn</span><b>r${f.revision} · ${esc(f.origin)}</b></div><div class="a-data-row"><span>Trạng thái</span><b>${f.status==='confirmed'?'Đã xác nhận':'Chờ xác nhận'}</b></div><div style="margin-top:18px" class="a-cta"><button class="btn primary" data-action="edit">${I('edit','sm')} Chỉnh sửa</button><button class="btn" data-action="pin">${I('pin','sm')} ${f.pinned?'Bỏ ghim':'Ghim'}</button><button class="btn icon-only" data-action="more-options" title="Thao tác khác">${I('more')}</button></div></aside>`}
function variantA(){return `<main class="wrap variant-a"><header class="a-head"><div><div class="eyebrow">AI VOICE STUDIO / PERSONAL INTELLIGENCE</div><h1 class="screen-title">Memory <span class="gradient-text">Studio</span></h1><div class="muted small">Quản lý những điều trợ lý ghi nhớ, theo từng thiết bị.</div></div><div class="a-head actions">${globalCtas()}</div></header><section class="a-hero"><div class="a-hero-main"><div class="row"><span class="chip on">${I('sparkle','sm')} LIVE CONTEXT PREVIEW</span>${modeBadge()}</div><h2 class="hero-title">Đây là điều AI đang nhớ</h2><p>Không hiển thị JSON thô theo mặc định. Mỗi dòng là một Fact trong Memory Summary gửi cho voice session.</p><div class="a-context-lines">${shownSummary().slice(0,3).map(f=>`<span class="memory-line">${I('checkcircle','sm')}${esc(f.hook)}</span>`).join('')||'<span class="memory-line">Không có Fact khả dụng</span>'}</div></div><div class="a-hero-aside"><div><div class="micro muted">FACTS IN THIS DEVICE</div><div class="hero-num">${own().length} <span>facts</span></div><div class="small muted" style="margin-top:9px">${shownSummary().length} dòng preview · ${summaryHidden()} dòng ẩn do giới hạn demo</div></div><div class="between"><span class="chip ${df().quarantine?'warn':'good'}">${I(df().quarantine?'alert':'checkcircle','sm')} ${df().quarantine} quarantined</span><button class="btn" data-action="summary">${I('eye','sm')} Xem AI context</button></div></div></section><div class="a-grid"><aside class="a-panel"><div class="section-head"><h3>Thư viện</h3>${I('filter','sm')}</div><div class="a-nav-items">${filtersA()}</div><div class="a-nav-foot"><button class="a-nav-item" data-action="profile">${I('user','sm')} <span class="grow">Profile chung</span>${I('chevron','sm')}</button><button class="a-nav-item" data-action="summary">${I('brain','sm')} <span class="grow">AI context</span>${I('chevron','sm')}</button></div></aside><section class="a-panel"><div class="section-head"><div><h3>${state.kind==='all'?'Tất cả facts':state.kind==='pinned'?'Facts đã ghim':state.kind==='pending'?'Chờ xác nhận':kinds[state.kind].label}</h3><p>Nhấp vào một Fact để xem và quản lý</p></div><span class="chip">${filtered().length} kết quả</span></div><div class="row" style="margin-bottom:15px">${filterSearch()}<button data-action="clear" class="btn icon-only" title="Xóa bộ lọc">${I('refresh','sm')}</button></div><div class="a-list">${filtered().length?filtered().map(f=>`<article class="a-fact ${state.selected===f.id?'selected':''}" data-action="open" data-value="${f.id}"><div class="between">${kindTag(f)}<span class="row">${f.pinned?`<span class="pin-icon">${I('pin','sm')}</span>`:''}${f.status!=='confirmed'?`<span class="chip warn">Pending</span>`:''}${I('chevron','sm')}</span></div><h4>${esc(f.title)}</h4><p>${esc(f.hook)}</p>${factMeta(f)}</article>`).join(''):`<div class="empty">${I('search')}Không có Fact phù hợp với bộ lọc.</div>`}</div></section>${inspectorA()}</div><div style="margin-top:17px">${notice()}</div></main>`}
function cardB(f){return `<article class="b-note ${f.kind}" data-action="open-modal" data-value="${f.id}"><div class="between"><span class="small muted">${esc(kinds[f.kind].label)}</span>${f.pinned?`<span class="corner">${I('pin','sm')}</span>`:`<span class="tiny dim">r${f.revision}</span>`}</div><h4>${esc(f.title)}</h4><p>${esc(f.hook)}</p><div class="between"><span class="tiny muted">${esc(f.updated)}</span>${f.status==='confirmed'?`<span style="color:var(--mint)">${I('checkcircle','sm')}</span>`:`<span style="color:var(--amber)">${I('clock','sm')}</span>`}</div></article>`}
function variantB(){let rows=filtered(),cols=[['preference','Sở thích & thói quen','heart'],['business','Dự án & công việc','briefcase'],['decision','Quyết định đã chốt','checkcircle'],['user','Thông tin người dùng','user'],['reference','Nguồn tham chiếu','bookmark']];const pct=own().length?Math.round(active().length/own().length*100):0;return `<main class="wrap variant-b"><header class="b-head"><div class="left"><div class="eyebrow">MEMORY CANVAS / CURATED INTELLIGENCE</div><h1>Memory <span class="gradient-text">Canvas</span></h1><div class="small muted">Một không gian mở để duyệt, nhóm và biên tập kiến thức về người dùng.</div></div><div class="b-tools">${globalCtas()}</div></header><section class="b-hero"><div class="b-welcome"><div class="chip on">${I('sparkle','sm')} YOUR SECOND BRAIN</div><h2>Những điều đáng nhớ.<br><span style="color:#a5edf0">Ở đúng nơi cần tìm.</span></h2><p>Từ sở thích, dự án đến quyết định quan trọng — các Fact được nhóm thành bộ sưu tập dễ khám phá, không ép người dùng đọc form liên tục.</p><div class="bottom"><button class="btn primary" data-action="new">${I('plus','sm')} Thêm ký ức</button><button class="btn" data-action="summary">${I('eye','sm')} AI đang nhìn thấy gì?</button></div></div><aside class="b-glance"><div class="between"><span class="micro muted">MEMORY HEALTH · ${esc(df().name)}</span>${modeBadge()}</div><div><div class="big">${pct}<span class="percent">%</span></div><div class="small muted">Fact đã được xác nhận</div><div class="bar"><span style="width:${pct}%"></span></div><div class="between" style="margin-top:15px"><span class="small muted">${active().length}/${own().length} confirmed</span><span class="small muted">${df().quarantine} quarantined</span></div></div></aside></section><div class="b-toprow"><div><div class="micro muted">CURATED COLLECTIONS</div><h3>Thư viện ký ức <span class="dim" style="font-size:14px">/ ${rows.length}</span></h3></div><div class="row" style="flex-wrap:wrap"><div style="width:260px">${filterSearch('Tìm trong bộ nhớ...')}</div><select class="select-inline" style="min-width:145px;max-width:155px" data-control="kind"><option value="all" ${state.kind==='all'?'selected':''}>Mọi nhóm</option>${Object.entries(kinds).map(([k,v])=>`<option value="${k}" ${state.kind===k?'selected':''}>${v.label}</option>`).join('')}<option value="pinned" ${state.kind==='pinned'?'selected':''}>Đã ghim</option><option value="pending" ${state.kind==='pending'?'selected':''}>Chờ xác nhận</option></select></div></div><div class="b-categories">${cols.map(([k,l,i])=>{const arr=rows.filter(f=>f.kind===k);return `<section class="b-column"><div class="b-col-head"><div class="row"><span class="bulb">${I(i,'sm')}</span><b>${l}</b></div><span class="chip">${arr.length}</span></div>${arr.length?arr.map(cardB).join(''):`<div class="empty">Chưa có Fact trong nhóm này.</div>`}<button class="btn ghost" data-action="new-kind" data-value="${k}" style="width:100%;margin-top:3px">${I('plus','sm')} Thêm vào nhóm</button></section>`}).join('')}</div><div class="b-bottom"><section class="b-context"><div class="section-head"><div><h3>${I('brain','sm')} Trích đoạn context</h3><p>Dữ liệu thực gửi cho LLM vẫn ở dạng có cấu trúc.</p></div><button class="btn" data-action="summary">Xem đầy đủ ${I('chevron','sm')}</button></div><pre>${esc(summaryRaw())}</pre></section><section class="b-profile"><div class="between"><span class="chip on">${I('user','sm')} DEPLOYMENT PROFILE</span><button class="btn ghost" data-action="profile">Chỉnh sửa ${I('chevron','sm')}</button></div><h3 style="margin:15px 0 5px">Hồ sơ dùng chung</h3><p>${esc(profile.split('\n').slice(0,2).join(' · '))}</p></section></div><div class="b-scrollnote">${I('info','sm')} Canvas là bố cục theo loại Fact, không biểu diễn quan hệ giữa các Fact. ${df().quarantine?'Device này có file quarantine cần kiểm tra.':''}</div>${notice()}</main>`}
function variantC(){let rows=filtered();return `<main class="wrap variant-c"><header class="c-head"><div><div class="eyebrow">MEMORY OPERATIONS / INDEX</div><h1>Memory <span class="gradient-text">Ledger</span></h1><div class="muted small">Kiểm soát từng Fact, trạng thái, revision và phạm vi Device.</div></div><div class="c-top-actions">${globalCtas()}</div></header><div class="c-metrics"><section class="c-metric"><span>01 / Tổng Fact</span><strong>${own().length}</strong><div class="fact-meta">trên ${esc(df().name)}</div></section><section class="c-metric"><span>02 / Confirmed</span><strong style="color:var(--mint)">${active().length}</strong><div class="fact-meta">khả dụng cho context</div></section><section class="c-metric"><span>03 / Pinned</span><strong style="color:var(--accent)">${own().filter(f=>f.pinned).length}</strong><div class="fact-meta">ưu tiên trong Summary</div></section><section class="c-metric"><span>04 / Quarantined</span><strong style="color:${df().quarantine?'var(--amber)':'var(--text)'}">${df().quarantine}</strong><div class="fact-meta">${df().quarantine?'cần đối soát':'không phát hiện'}</div></section></div><section class="c-toolbar"><span class="chip on">${I('database','sm')} DEVICE INDEX</span><div style="width:min(340px,100%)">${filterSearch('Search facts...')}</div><span class="micro muted">Status</span><select class="select-inline" data-control="status" style="min-width:145px"><option value="all" ${state.ledgerStatus==='all'?'selected':''}>Tất cả</option><option value="confirmed" ${state.ledgerStatus==='confirmed'?'selected':''}>Confirmed</option><option value="pending" ${state.ledgerStatus==='pending'?'selected':''}>Pending</option></select><span class="micro muted">Loại</span><select class="select-inline" data-control="kind" style="min-width:150px"><option value="all" ${state.kind==='all'?'selected':''}>Tất cả</option>${Object.entries(kinds).map(([k,v])=>`<option value="${k}" ${state.kind===k?'selected':''}>${v.label}</option>`).join('')}<option value="pinned" ${state.kind==='pinned'?'selected':''}>Đã ghim</option></select><button class="btn ghost" data-action="clear">${I('refresh','sm')} Reset</button></section><div class="c-compact-summary"><span class="chip on">${I('terminal','sm')} MEMORY.md</span><span class="preview">${esc(summaryRaw().split('\n')[0]||'No context available')}</span><span class="small muted">+${summaryHidden()} ẩn</span><button class="btn ghost" data-action="summary">Mở preview ${I('chevron','sm')}</button></div><div class="c-content"><section class="c-table-card"><table class="c-table"><thead><tr><th>Fact / Hook</th><th>Kind</th><th>State</th><th>Pin</th><th>Revision</th><th>Updated</th><th style="width:30px"></th></tr></thead><tbody>${rows.length?rows.map(f=>`<tr data-action="open" data-value="${f.id}" class="${state.selected===f.id?'selected':''}"><td><div class="factname">${esc(f.title)}</div><div class="subtitle" title="${esc(f.hook)}">${esc(f.hook)}</div></td><td>${kindTag(f)}</td><td><span class="c-stat ${f.status==='confirmed'?'ok':'pending'}">${I(f.status==='confirmed'?'checkcircle':'clock','sm')}${f.status}</span></td><td>${f.pinned?`<span style="color:var(--amber)">${I('pin','sm')}</span>`:'<span class="dim">—</span>'}</td><td class="mono">r${f.revision}</td><td>${esc(f.updated)}</td><td>${I('chevron','sm')}</td></tr>`).join(''):`<tr><td colspan="7"><div class="empty">Không có dữ liệu phù hợp.</div></td></tr>`}</tbody></table><div class="c-footer" style="margin:0;padding:14px 18px"><span>${rows.length} record(s) · dữ liệu minh họa</span><span>Click row → inspect</span></div></section><aside class="c-sidetab">${ledgerInspector()}</aside></div><div style="margin-top:15px">${notice()}</div></main>`}
function ledgerInspector(){let f=selected();if(!f)return `<div class="empty">${I('file')}Chọn một hàng để kiểm tra Fact.</div>`;return `<div class="between"><span class="micro muted">RECORD INSPECTOR</span><span class="chip">${f.id}</span></div><h3 class="c-headtitle">${esc(f.title)}</h3><div class="row" style="flex-wrap:wrap;margin-bottom:14px">${kindTag(f)}${stateBadge(f)}</div><div class="micro muted" style="margin-bottom:9px">HOOK / RECALL TRIGGER</div><div class="small" style="line-height:1.6;margin-bottom:17px">${esc(f.hook)}</div><div class="micro muted" style="margin-bottom:9px">CANONICAL CONTENT</div><div class="json">${esc(f.body)}</div><div class="between" style="margin:16px 0"><span class="tiny muted">Context: ${isInSummary(f)?'included in preview':'not in preview'}</span><span class="tiny muted">r${f.revision}</span></div><div class="row" style="flex-wrap:wrap"><button class="btn primary" data-action="edit">${I('edit','sm')} Edit</button><button class="btn" data-action="pin">${I('pin','sm')} ${f.pinned?'Unpin':'Pin'}</button><button class="btn danger" data-action="forget-confirm">${I('trash','sm')} Forget</button></div>`}
function focusChapterMenu(){return [['facts','Đọc Fact','book'],['context','AI nhìn thấy','eye'],['profile','Profile chung','user']].map(([key,label,ico])=>`<button class="d-section-tab ${state.focusSection===key?'active':''}" data-action="focus-section" data-value="${key}">${I(ico,'sm')} ${label}<span class="count">${key==='facts'?own().length:key==='context'?shownSummary().length:''}</span></button>`).join('')}
function focusArticle(){if(state.focusSection==='context')return `<div class="d-article"><div class="eyebrow">AI / MEMORY CONTEXT</div><h1>Điều AI thực sự<br>nhìn thấy.</h1><p class="lead">Các Fact đã xác nhận được đưa vào summary theo giới hạn kích thước. Đoạn dưới là minh họa cho device đang chọn.</p><div class="d-context-page">${shownSummary().map((f,i)=>`<div class="context-line"><span class="num">${String(i+1).padStart(2,'0')}</span><div><b>${esc(f.title)}</b><div class="muted">${esc(f.hook)}</div></div></div>`).join('')||'Không có Fact trong Summary.'}<div class="muted tiny" style="padding-top:13px">${summaryHidden()} Fact ẩn khỏi demo preview · Thực tế phụ thuộc giới hạn byte của server.</div></div><div class="article-tools" style="margin-top:18px"><button class="btn primary" data-action="summary">${I('terminal','sm')} Xem raw JSON</button><button class="btn" data-action="rebuild">${I('refresh','sm')} Rebuild</button></div></div>`;if(state.focusSection==='profile')return `<div class="d-article"><div class="eyebrow">SHARED / DEPLOYMENT PROFILE</div><h1>Hồ sơ<br>dùng chung.</h1><p class="lead">Khác với Fact, Profile này không thuộc riêng Device đang chọn.</p><div class="d-profile-page">${esc(profile)}</div><div class="article-tools" style="margin-top:30px"><button class="btn primary" data-action="profile">${I('edit','sm')} Chỉnh sửa Profile</button></div></div>`;let rows=filtered(),f=rows.find(x=>x.id===state.selected)||rows[0];if(!f)return `<div class="d-article"><div class="empty">${I('book')}Không có Fact phù hợp. Thử bộ lọc khác.</div></div>`;let idx=rows.findIndex(x=>x.id===f.id),prev=rows[(idx-1+rows.length)%rows.length],next=rows[(idx+1)%rows.length];return `<article class="d-article"><div class="topbar"><div class="row"><span class="chip">MEMORY NOTE ${String(idx+1).padStart(2,'0')} / ${String(rows.length).padStart(2,'0')}</span>${kindTag(f)}</div><span class="row tiny muted">${I('clock','sm')} ${esc(f.updated)} · r${f.revision}</span></div><h1>${esc(f.title)}</h1><p class="lead">${esc(f.hook)}</p><div class="line"></div><div class="readable">${esc(f.body)}</div><div class="row" style="gap:8px;margin-bottom:24px">${stateBadge(f)}${f.pinned?`<span class="chip on">${I('pin','sm')} Pinned</span>`:''}</div><div class="article-tools"><button class="btn primary" data-action="edit" data-value="${f.id}">${I('edit','sm')} Chỉnh sửa</button><button class="btn" data-action="pin" data-value="${f.id}">${I('pin','sm')} ${f.pinned?'Bỏ ghim':'Ghim vào Summary'}</button><button class="btn danger" data-action="forget-confirm" data-value="${f.id}">${I('trash','sm')} Quên</button></div><nav class="d-next"><button data-action="open" data-value="${prev.id}">${I('left','sm')} ${esc(prev.title)}</button><span class="tiny dim">${idx+1} / ${rows.length}</span><button data-action="open" data-value="${next.id}">${esc(next.title)} ${I('chevron','sm')}</button></nav></article>`}
function variantD(){let f=selected();return `<main class="wrap variant-d"><header class="d-top"><div class="row"><span style="width:34px;height:34px;border-radius:12px;background:#a99cff21;display:grid;place-items:center;color:#c5baff">${I('brain','lg')}</span><span class="d-logo">MEMORY / FOCUS</span><span class="demo-pill">READING EXPERIENCE</span></div><div class="d-head-actions">${globalCtas()}</div></header><div class="d-container"><aside class="d-left"><div class="eyebrow" style="margin:9px 0 19px 10px">PERSONAL KNOWLEDGE</div><div class="chapter-menu">${focusChapterMenu()}</div><div class="chapters">THE LIBRARY</div><div class="chapter-menu">${[['all','Tất cả','layers'],['pinned','Đã ghim','pin'],['user','Người dùng','user'],['preference','Sở thích','heart'],['business','Công việc','briefcase'],['decision','Quyết định','checkcircle'],['reference','Tham chiếu','bookmark']].map(([key,l,ico])=>`<button class="d-section-tab ${state.kind===key&&state.focusSection==='facts'?'active':''}" data-action="focus-kind" data-value="${key}">${I(ico,'sm')} ${l}</button>`).join('')}</div><div style="margin-top:26px">${filterSearch('Tìm một ghi nhớ...')}</div></aside>${focusArticle()}<aside class="d-right"><section class="d-ai-card"><div class="heart">${I('brain','xl')}</div><div class="micro muted">AI MEMORY STATUS</div><h3>${state.focusSection==='facts'&&f&&isInSummary(f)?'AI có thể thấy Fact này':'Ngữ cảnh hiện tại'}</h3><p>Context của <b>${esc(df().name)}</b> chứa ${shownSummary().length} dòng preview. ${summaryHidden()?`${summaryHidden()} Fact chưa hiển thị trong demo preview.`:'Không có Fact ẩn trong demo.'}</p><div class="d-highlight">${esc(f&&state.focusSection==='facts'?f.hook:shownSummary()[0]?.hook||'Chưa có nội dung')}</div><button class="btn" data-action="summary" style="width:100%;margin-top:14px">${I('eye','sm')} Kiểm tra context</button></section><section class="d-card"><div class="section-head"><h3>Ghim quan trọng</h3><span class="chip">${own().filter(x=>x.pinned).length}</span></div><div class="d-pins">${own().filter(x=>x.pinned).map(x=>`<button class="d-pin" data-action="focus-open" data-value="${x.id}">${I('pin','sm')}<b>${esc(x.title)}</b><span>${esc(x.hook)}</span></button>`).join('')||'<span class="muted small">Chưa có Fact được ghim.</span>'}</div></section><div class="notice">${I('info','sm')}<span>Phân vùng theo Device không thay thế cơ chế xác thực. Dữ liệu Fact có thể được gửi đến nhà cung cấp LLM.</span></div></aside></div></main>`}
function switcher(){const names={A:'Studio · 3 panes',B:'Canvas · collections',C:'Ledger · operations',D:'Focus · reading'};return `<nav class="protoswitch" aria-label="Chuyển phương án giao diện"><span class="demo-pill" style="margin-right:4px">PROTOTYPE</span><button class="proto-arrow" data-action="prev-variant" title="Phương án trước (←)">${I('left','sm')}</button><span class="label"><strong>Phương án ${state.variant}</strong><span>${names[state.variant]}</span></span>${Object.keys(names).map(k=>`<button data-action="variant" data-value="${k}" class="proto-variant ${state.variant===k?'active':''}" title="${names[k]}">${k}</button>`).join('')}<button class="proto-arrow" data-action="next-variant" title="Phương án sau (→)">${I('chevron','sm')}</button><button class="proto-arrow" data-action="state" title="Xem trạng thái demo">${I('terminal','sm')}</button></nav>${state.showState?`<div class="proto-state"><div class="between" style="margin-bottom:10px"><b class="small">DEMO STATE · no persistence</b><button class="btn icon-only" data-action="state">${I('close','sm')}</button></div><pre>${esc(JSON.stringify({variant:state.variant,device:state.device,kind:state.kind,query:state.query,selected:state.selected,mode:df().mode,summaryCount:shownSummary().length,summaryHidden:summaryHidden(),facts:own().map(f=>({id:f.id,title:f.title,kind:f.kind,status:f.status,pinned:f.pinned,revision:f.revision}))},null,2))}</pre></div>`:''}`}
function dialog(){if(!state.modal)return '';let f=selected();let header='',content='',footer='',wide='';if(['new','edit'].includes(state.modal)){let edit=state.modal==='edit'&&!!f,source=edit?f:null;header=edit?'Chỉnh sửa Fact':'Tạo Fact mới';content=`<form id="factForm" data-form="fact" class="dialog-content"><div><label class="field-label" for="factTitle">Tiêu đề Fact <span style="color:var(--pink)">*</span></label><input id="factTitle" name="title" class="field" maxlength="120" required value="${esc(source?.title||'')}" placeholder="VD: Sở thích làm việc"></div><div><label class="field-label" for="factHook">Hook · câu gợi nhớ</label><input id="factHook" name="hook" class="field" maxlength="200" value="${esc(source?.hook||'')}" placeholder="Một dòng để AI biết khi nào cần tìm lại Fact"><p class="help">Hook xuất hiện trong Memory Summary, cùng với loại và tiêu đề.</p></div><div><label class="field-label" for="factKind">Loại Fact</label><select id="factKind" name="kind" class="field" ${edit?'disabled':''}>${Object.entries(kinds).map(([k,v])=>`<option value="${k}" ${(source?.kind||(state.kind in kinds?state.kind:'user'))===k?'selected':''}>${v.label}</option>`).join('')}</select>${edit?`<p class="help">Kind không được sửa sau khi tạo, theo API hiện tại.</p>`:''}</div><div><label class="field-label" for="factBody">Nội dung · Markdown <span style="color:var(--pink)">*</span></label><textarea id="factBody" name="body" class="field" rows="7" maxlength="2000" required placeholder="Viết nội dung fact...">${esc(source?.body||'')}</textarea></div></form>`;footer=`${edit?`<button class="btn danger" data-action="forget-confirm">${I('trash','sm')} Forget</button><button class="btn danger" data-action="discard-confirm">${I('archive','sm')} Discard</button><button class="btn" data-action="pin">${I('pin','sm')} ${f.pinned?'Unpin':'Pin'}</button>`:''}<div class="control-spacer"></div><button class="btn" data-action="close-modal">Hủy</button><button class="btn primary" data-action="save-fact">${I('check','sm')} ${edit?'Lưu thay đổi':'Tạo Fact'}</button>`;wide='wide';}
else if(state.modal==='summary'){header='Memory Summary · LLM preview';content=`<div class="dialog-content"><div class="notice">${I('info','sm')}<span>Đây là mô phỏng định dạng JSON line của Memory Summary trong server. Thực tế số Fact được giữ lại do ngân sách byte và thứ tự ưu tiên quyết định.</span></div><div class="between"><span class="micro muted">DEVICE · ${esc(df().name)}</span><span class="chip">${shownSummary().length} dòng · ${summaryHidden()} ẩn</span></div><div class="summary-lines">${esc(summaryRaw()||'(empty)')}</div><div class="between"><div class="small muted">${I('shield','sm')} ${df().mode==='off'?'Memory mode đang Off':'Context chỉ dùng Fact confirmed'}</div><button class="btn" data-action="copy-summary">${I('copy','sm')} Sao chép</button></div></div>`;footer=`<button class="btn primary" data-action="close-modal">Đóng preview</button>`;wide='wide';}
else if(state.modal==='profile'){header='Deployment Profile · dùng chung';content=`<form data-form="profile" id="profileForm" class="dialog-content"><div class="notice">${I('info','sm')}<span>Profile không thuộc riêng Device hiện tại. Thay đổi Profile ảnh hưởng đến các Device nhận context này.</span></div><label class="field-label" for="profileBody">Hồ sơ deployment</label><textarea name="profile" id="profileBody" class="field" rows="9">${esc(profile)}</textarea></form>`;footer=`<button class="btn" data-action="close-modal">Hủy</button><button class="btn primary" data-action="save-profile">${I('check','sm')} Lưu profile</button>`;}
else if(state.modal==='rebuild'){header='Rebuild Memory Index';content=`<div class="dialog-content"><p class="small" style="line-height:1.8;margin:0">Tạo lại chỉ mục cho <b>${esc(df().name)}</b>. Thao tác này không tạo hoặc quên Fact, và chỉ chạy mô phỏng trong prototype.</p><div class="notice">${I('database','sm')}<span>${own().length} Fact · ${df().quarantine} quarantined · Memory mode: ${esc(df().mode)}</span></div></div>`;footer=`<button class="btn" data-action="close-modal">Hủy</button><button class="btn primary" data-action="run-rebuild">${I('refresh','sm')} Rebuild demo</button>`;}
else if(state.modal==='more'){header='Quản lý Fact';content=`<div class="dialog-content"><div class="small muted">${f?esc(f.title):'Chưa chọn Fact'}</div><button class="btn" data-action="edit">${I('edit','sm')} Chỉnh sửa</button><button class="btn" data-action="discard-confirm">${I('archive','sm')} Discard — hoàn tác và có thể lưu lại</button><button class="btn danger" data-action="forget-confirm">${I('trash','sm')} Forget — lưu tombstone ngăn nhớ lại</button></div>`;footer=`<button class="btn" data-action="close-modal">Đóng</button>`;}
else if(state.modal==='confirm'){let isForget=state.confirmAction==='forget';header=isForget?'Quên vĩnh viễn Fact?':'Hoàn tác Fact?';content=`<div class="dialog-content"><p style="font-size:13px;margin:0">${esc(f?.title||'Fact đang chọn')}</p><div class="danger-box">${I('alert','sm')} ${isForget?'Forget tạo tombstone để nội dung này không trở lại qua những đường đọc của Memory.':'Discard xóa Fact nhưng không tạo tombstone. Có thể lưu lại cùng nội dung sau này.'}</div><div class="small muted">Đây là giao diện mô phỏng. Không có thay đổi nào gửi lên server.</div></div>`;footer=`<button class="btn" data-action="close-modal">Hủy</button><button class="btn danger" data-action="confirm-remove">${I(isForget?'trash':'archive','sm')} ${isForget?'Xác nhận Forget':'Xác nhận Discard'}</button>`;}
return `<div class="scrim" data-action="scrim"><section class="dialog ${wide}" role="dialog" aria-modal="true" aria-label="${esc(header)}"><header class="dialog-header"><div><div class="eyebrow">MEMORY / ${state.modal.toUpperCase()}</div><h2>${header}</h2></div><button data-action="close-modal" class="btn icon-only" aria-label="Đóng">${I('close')}</button></header>${content}<footer class="dialog-footer">${footer}</footer></section></div>`}
function render(){document.getElementById('root').innerHTML=({A:variantA,B:variantB,C:variantC,D:variantD}[state.variant])()+switcher()+dialog();}
function act(action,el){let value=el.dataset.value;if(value&&(['open','open-modal','focus-open','edit','pin','forget-confirm','discard-confirm'].includes(action))){if(own().some(f=>f.id===value))state.selected=value;}
switch(action){case'variant':setVariant(value);return;case'prev-variant':case'next-variant':{let v=['A','B','C','D'],i=v.indexOf(state.variant);setVariant(v[(i+(action==='prev-variant'?-1:1)+4)%4]);return;}case'device':return;case'kind':state.kind=value;state.ledgerStatus='all';state.focusSection='facts';break;case'focus-kind':state.kind=value;state.focusSection='facts';break;case'focus-section':state.focusSection=value;break;case'focus-open':state.focusSection='facts';state.kind='all';break;case'open':case'focus-open':break;case'open-modal':state.modal='edit';break;case'new':state.modal='new';break;case'new-kind':state.kind=value;state.modal='new';break;case'edit':if(selected())state.modal='edit';break;case'pin':{let f=selected();if(f){f.pinned=!f.pinned;notify(f.pinned?'Đã ghim Fact (demo)':'Đã bỏ ghim (demo)')}if(state.modal==='edit')state.modal=null;break;}case'more-options':state.modal='more';break;case'forget-confirm':state.confirmAction='forget';state.modal='confirm';break;case'discard-confirm':state.confirmAction='discard';state.modal='confirm';break;case'confirm-remove':{let id=state.selected;facts=facts.filter(f=>f.id!==id);state.selected=own()[0]?.id||null;state.modal=null;notify(state.confirmAction==='forget'?'Đã Forget và mô phỏng tombstone':'Đã Discard; có thể lưu lại nội dung');break;}case'summary':state.modal='summary';break;case'profile':state.modal='profile';break;case'rebuild':state.modal='rebuild';break;case'run-rebuild':state.modal=null;notify('Rebuild demo hoàn tất — không gọi API');break;case'copy-summary':navigator.clipboard?.writeText(summaryRaw()).then(()=>notify('Đã sao chép JSON context'),()=>notify('Không thể sao chép trong trình duyệt này'));return;case'clear':state.kind='all';state.query='';state.ledgerStatus='all';break;case'state':state.showState=!state.showState;break;case'close-modal':state.modal=null;break;case'scrim':if(el.classList.contains('scrim'))state.modal=null;break;case'save-fact':{let form=document.getElementById('factForm');if(form)form.requestSubmit();return;}case'save-profile':{let form=document.getElementById('profileForm');if(form)form.requestSubmit();return;}default:return;}render();}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='scrim' && e.target!==el)return;e.preventDefault();act(el.dataset.action,el)});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset?.control)return;switch(el.dataset.control){case'device':state.device=el.value;state.kind='all';state.query='';state.selected=own()[0]?.id||null;state.ledgerStatus='all';state.focusSection='facts';notify('Đã chọn Device '+df().name);break;case'kind':state.kind=el.value;break;case'status':state.ledgerStatus=el.value;break;case'sort':state.sort=el.value;break;}render()});
document.addEventListener('submit',e=>{const form=e.target;let type=form.dataset?.form;if(!type)return;e.preventDefault();if(type==='search'){state.query=String(new FormData(form).get('q')||form.querySelector('input')?.value||'').trim();render();return;}if(type==='profile'){profile=String(new FormData(form).get('profile')||'');state.modal=null;notify('Đã cập nhật profile trong demo');render();return;}if(type==='fact'){if(!form.reportValidity())return;let data=new FormData(form);const payload={title:String(data.get('title')||'').trim(),hook:String(data.get('hook')||'').trim(),body:String(data.get('body')||'').trim(),kind:String(data.get('kind')||selected()?.kind||'user')};if(!payload.title||!payload.body)return;if(state.modal==='edit'&&selected()){Object.assign(selected(),payload,{revision:selected().revision+1,updated:'Vừa xong'});notify('Đã cập nhật Fact (demo)');}else{let f={id:'demo_'+(nextID++),device:state.device,...payload,status:'confirmed',pinned:false,revision:1,updated:'Vừa xong',origin:'admin'};facts.unshift(f);state.selected=f.id;state.kind='all';state.query='';state.ledgerStatus='all';notify('Đã tạo Fact mới (demo)');}state.modal=null;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render();return}if(['ArrowLeft','ArrowRight'].includes(e.key)&&!state.modal&&!e.target.closest('input,textarea,select,[contenteditable]')){e.preventDefault();let v=['A','B','C','D'],i=v.indexOf(state.variant);setVariant(v[(i+(e.key==='ArrowLeft'?-1:1)+4)%4]);}});
window.addEventListener('popstate',()=>{let q=new URLSearchParams(location.search).get('variant')?.toUpperCase();state.variant=['A','B','C','D'].includes(q)?q:'A';render()});
render();
</script>
</body>
</html>
