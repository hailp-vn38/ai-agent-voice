manifest_version = 1
[plugin]
id = "document-analysis"
name = "Document Analysis"
version = "1.0.0"
description = "Parse and analyze PDF, DOCX, Markdown without network access"

[runtime]
kind = "rust_container"
entrypoint = "bin/plugin"
protocol = "jsonl-v1"

[agent]
instructions = "instructions.md"

[operations.analyze_document]
description = "Extract readable text, headings and document statistics"
provides = ["document.extract", "document.analyze"]
sources = ["document"]
input_schema = "schemas/analyze_document.input.json"
output_schema = "schemas/analyze_document.output.json"
replay = "safe_read"
