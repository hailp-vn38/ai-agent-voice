[package]
name = "document-analysis"
version = "1.0.0"
edition = "2021"
publish = false

[workspace]
[dependencies]
agent-job-plugin-sdk = { path = "../rust-plugin-sdk" }
serde_json = "1"
base64 = "0.22"
lopdf = "0.35"
quick-xml = "0.31"
zip = { version = "2", default-features = false, features = ["deflate"] }
pulldown-cmark = "0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
