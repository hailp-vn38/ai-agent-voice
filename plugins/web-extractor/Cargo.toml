[package]
name = "web-extractor"
version = "1.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
agent-job-plugin-sdk = { path = "../rust-plugin-sdk" }
serde_json = "1"
scraper = "0.23"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "charset"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
