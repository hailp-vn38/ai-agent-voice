manifest_version = 1

[plugin]
id = "web-extractor"
name = "Web Extractor"
version = "1.0.0"
description = "Extract readable text, headings, links and metadata from public HTML pages"

[runtime]
kind = "rust_container"
entrypoint = "bin/plugin"
protocol = "jsonl-v1"

[permissions]
# These are examples only: edit to exact domains approved by your deployment.
# Admin must approve all listed hosts; rootless egress must qualify each.
network_hosts = ["example.com", "en.wikipedia.org"]

[agent]
instructions = "instructions.md"

[operations.extract_html]
description = "Parse supplied HTML without fetching the network"
provides = ["web.extract"]
sources = ["web"]
input_schema = "schemas/extract_html.input.json"
output_schema = "schemas/extract.output.json"
replay = "safe_read"

[operations.fetch_url]
description = "Fetch a public HTML URL through the approved network proxy and extract content"
provides = ["web.extract", "web.fetch"]
sources = ["web"]
input_schema = "schemas/fetch_url.input.json"
output_schema = "schemas/extract.output.json"
replay = "safe_read"
