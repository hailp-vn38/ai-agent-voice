[workspace]
members = ["crates/voice-agent-server", "crates/voice-reference-client"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws", "macros"] }
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
http = "1.0"
hound = "3.5"
opus2 = { version = "0.4", default-features = false, features = ["backend-libopus", "bundled", "static"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sherpa-onnx = "=1.13.8"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "1.1"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
