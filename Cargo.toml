[workspace]
members = ["crates/voice-agent-server", "crates/voice-reference-client"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["ws", "macros"] }
clap = { version = "=4.4.18", features = ["derive"] }
futures-util = "0.3"
http = "1.0"
reqwest = { version = "=0.11.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "fs"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
toml = "=0.8.8"
tower-http = { version = "0.5", features = ["trace"] }
opus2 = { version = "0.4", default-features = false, features = ["backend-libopus", "bundled", "static"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "=2.4.1", features = ["serde"] }
uuid = { version = "=1.6.1", features = ["v4", "serde"] }
